name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔐 Type check
        run: npx tsc --noEmit

      - name: 🏗 Build APK via EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Trigger EAS build
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📌 提示
        run: |
          echo "=================================="
          echo "构建已提交到 EAS 云端！"
          echo "打开 https://expo.dev/accounts/$(echo $EXPO_USER)/projects/calorie-tracker/builds 查看进度和下载 APK"
          echo "=================================="
